services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env
    environment:
      - ENVIRONMENT=production
      - SOF_AUTO_MATERIALIZE=true
      - PROVIDER_ASSISTANT_MODE=context
      - TRACES_API_ENABLED=false
      - TRACING_ENABLED=true
      - TRACING_SAMPLE_RATE=1.0
      - PROVIDER_ASSISTANT_ALLOW_CLIENT_OVERRIDES=false
      - PROVIDER_ASSISTANT_MAX_RESPONSE_TOKENS=2000
      - CORS_ALLOWED_ORIGINS=https://ehi.healthcaredataai.com
      - ALLOWED_HOSTS=ehi.healthcaredataai.com
      - CURSOR_SIDECAR_URL=http://cursor-sidecar:3040
      - FHIR_CONVERTER_URL=http://fhir-converter:8080
      - FHIR_CONVERTER_API_VERSION=2024-05-01-preview
      - FHIR_CONVERTER_REQUIRED=true
      - FHIR_CONVERTER_TIMEOUT_SECONDS=45
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    depends_on:
      - cursor-sidecar
      - fhir-converter
    networks:
      - personal-website_default

  fhir-converter:
    image: mcr.microsoft.com/healthcareapis/fhir-converter:1.0.0-preview@sha256:202c898d9807015a2b6269d3a6fe581cfaecc247ac163cd53d3e69e9cfc3659f
    restart: unless-stopped
    ports:
      # Localhost-only binding for SSH tunnel development:
      # ssh -L 18080:127.0.0.1:18080 hetzner2
      - "127.0.0.1:18080:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/check >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - personal-website_default

  cursor-sidecar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cursor-sidecar
    env_file: ../.env
    environment:
      - CURSOR_SIDECAR_PORT=3040
    restart: unless-stopped
    networks:
      - personal-website_default

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - personal-website_default

networks:
  personal-website_default:
    external: true
